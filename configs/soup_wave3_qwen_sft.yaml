# Soup SFT Configuration for Wave 3 Misconception Reasoning (Apple Silicon / Cloud Parity)
# Target: Fine-tune Qwen2.5-VL-7B-Instruct on Process-Supervised Math Steps with Image Inputs

base: Qwen/Qwen2.5-VL-7B-Instruct
task: sft
backend: transformers

data:
  train: scratch/qwen_soup_train_sharegpt.jsonl
  format: sharegpt
  val_split: 0.1
  max_length: 512

training:
  epochs: 3
  lr: 2e-5
  batch_size: 1
  gradient_accumulation_steps: 4
  lora:
    r: 16
    alpha: 32
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  quantization: none
  gradient_checkpointing: true
  save_steps: 10
  logging_steps: 10

output: models/soup_qwen2.5_sft
