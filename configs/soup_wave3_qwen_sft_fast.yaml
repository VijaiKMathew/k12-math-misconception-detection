# Soup SFT Configuration: Fast 1-Epoch M5 Optimized Run
# Target: Fine-tune Qwen2.5-VL-7B-Instruct on Math Step Diagnostic Rationale & Root Codes

base: Qwen/Qwen2.5-VL-7B-Instruct
task: sft
backend: transformers

data:
  train: scratch/qwen_soup_train_sharegpt.jsonl
  format: sharegpt
  val_split: 0.1
  max_length: 512

training:
  epochs: 1
  lr: 3e-5
  batch_size: 1
  gradient_accumulation_steps: 4
  lora:
    r: 16
    alpha: 32
    target_modules:
      - q_proj
      - v_proj
  quantization: none
  gradient_checkpointing: true
  save_steps: 10
  logging_steps: 5

output: models/soup_qwen2.5_sft_fast
