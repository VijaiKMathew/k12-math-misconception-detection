[project]
name = "misconception-detection-in-k-12-student-math-workings"
version = "0.1.0"
description = "Harness and Solution for Kaggle Misconception Detection in K-12 Student Math Workings"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.0.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "pyarrow>=15.0.0",
    "polars>=1.0.0",
    "tqdm>=4.66.0",
    "google-genai>=2.33.0",
    "catboost>=1.2.10",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qaggle"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]



