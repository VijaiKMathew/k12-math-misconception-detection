  <text x="46" y="47" fill="#ffffff" font-size="19" font-weight="800">RESILIENT CLOUD COMPUTE ORCHESTRATION: TAILSCALE WIREGUARD MESH &amp; KAGGLE FALLBACK</text>
  <text x="46" y="69" fill="#94a3b8" font-size="12.5" font-weight="500">How we trained 7B Multimodal QLoRA (Qwen2.5-VL) and FP32 DeBERTa-v3-Large on a single Google Colab account with zero lost work</text>
</g>
<g filter="url(#shadow-sm)">
