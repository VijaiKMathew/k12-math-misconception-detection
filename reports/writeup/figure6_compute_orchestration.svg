  <path d="M 24 122 Q 24 112 34 112 L 364 112 Q 374 112 374 122 L 374 146 L 24 146 Z" fill="#1e293b"/>
  <text x="38" y="133.5" fill="#ffffff" font-size="13" font-weight="700">1. Local Control Workstation</text>
  <rect x="280.0" y="119.0" width="84.0" height="20" rx="10" fill="#475569"/>
  <text x="322.0" y="133.0" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle" class="mono">macOS Host</text>
  <text x="38" y="178.94285714285715" fill="#334155" font-size="11.8" font-weight="500">• Git Worktree Branch Isolation</text>
  <text x="38" y="220.65714285714284" fill="#334155" font-size="11.8" font-weight="500">• uv Reproducible Lockfile Sync</text>
  <text x="38" y="262.37142857142857" fill="#334155" font-size="11.8" font-weight="500">• AST Anti-Slop &amp; Secret Linter</text>
  <text x="38" y="304.0857142857143" fill="#334155" font-size="11.8" font-weight="500">• 8.33 MB Tarball Code Packager</text>
  <text x="38" y="345.8" fill="#334155" font-size="11.8" font-weight="500">• Headless SSH Runner Daemon</text>
  <text x="38" y="387.51428571428573" fill="#334155" font-size="11.8" font-weight="500">• Automated 6-Gate Local Audit</text>
  <text x="38" y="429.22857142857146" fill="#0f172a" font-size="11.8" font-weight="700">★ Zero Manual Browser Clicking</text>
</g>
<g filter="url(#shadow-sm)">
